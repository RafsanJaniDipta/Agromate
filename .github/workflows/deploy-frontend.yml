name: Frontend CI/CD

on:
  # PRs into working: lint + build only, no deploy
  pull_request:
    branches:
      - working
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend.yml'
  # Merged into working: check, then deploy
  push:
    branches:
      - working
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend.yml'
  # "Run workflow" button in the Actions tab
  workflow_dispatch:

# A newer run on the same branch cancels the older one
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: client/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Tells the Vercel CLI which project to deploy to
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # The runner image no longer ships the Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel builds it remotely; the project's Root Directory must be "client"
      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
